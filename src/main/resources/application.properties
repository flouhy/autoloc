# ── Base H2 en mémoire ──────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:autoloc;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Hibernate / JPA ─────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop : crée le schéma au démarrage et le supprime à l'arrêt
spring.jpa.hibernate.ddl-auto=create-drop
# Affiche les requêtes SQL générées
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Console H2 (accessible via http://localhost:8080/h2-console) ─
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
